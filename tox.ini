[tox]
envlist = py{36,37,38,39}
minversion = 3.3.0
isolated_build = true

[testenv]
usedevelop = True
deps =
    check-manifest >= 0.42
    build
    twine
    pytest
    pytest-asyncio
    coverage
commands =
    check-manifest --ignore 'tox.ini,tests/**,.editorconfig,vscode.env,.vscode/**'
    python -m build
    python -m twine check dist/*
    pytest tests {posargs}
    coverage run -m --source=pcbutils pytest
    coverage report -m
    coverage html
